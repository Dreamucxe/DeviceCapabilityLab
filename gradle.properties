# Standard Android/Kotlin project settings.
org.gradle.caching=false
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Building on a memory-constrained machine (an on-device ARM host, a small CI
# container) is easier with the daemon off and the Kotlin compiler in-process:
#
#   org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
#   org.gradle.daemon=false
#   org.gradle.parallel=false
#   kotlin.compiler.execution.strategy=in-process
#
# Those belong in your own ~/.gradle/gradle.properties rather than here, since they
# describe the machine and not the project. Two others may be needed on an ARM host:
# org.gradle.java.home, if the default JDK is newer than 17, and
# android.aapt2FromMavenOverride, because the aapt2 the Android Gradle Plugin
# downloads is an x86_64 binary.
